spring.application.name=Trending
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.hibernate.format_sql=false

# Neon S3 Object Storage Configuration (read from environment variables)
aws.s3.endpoint=${AWS_ENDPOINT_URL_S3}
aws.s3.access-key=${AWS_ACCESS_KEY_ID}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY}
aws.s3.region=${AWS_REGION:ap-southeast-1}
aws.s3.bucket-name=${NEON_BUCKET_NAME:profile-picture}

# Direct env bindings
AWS_ENDPOINT_URL_S3=${AWS_ENDPOINT_URL_S3}
AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
AWS_REGION=${AWS_REGION:ap-southeast-1}
NEON_BUCKET_NAME=${NEON_BUCKET_NAME:profile-picture}

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=900000

# Redis Configuration
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}

# Logging and Upload Limits
logging.level.org.springframework.security=WARN
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
